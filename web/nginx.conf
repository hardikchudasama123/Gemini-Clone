# Docker's embedded DNS. Needed because proxy_pass below goes through a
# variable, which makes nginx re-resolve `api` per request instead of caching
# the IP from startup — otherwise restarting the api container would 502 the
# frontend until nginx itself was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames, so these can never go stale.
  location /assets/ {
    try_files $uri =404;
    # One header, not `expires` plus `add_header` — that emits Cache-Control
    # twice and leaves it to the browser which one wins.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The entry point must not be cached, or a deploy ships new assets that no
  # browser is told to ask for.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    set $api http://api:8787;
    proxy_pass $api$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/chat is an SSE stream. Without these the reply is buffered and
    # arrives in one lump at the end instead of token by token. The server
    # also sends X-Accel-Buffering: no, but do not rely on that alone.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;

    # A long generation must outlive nginx's 60s default.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Left at the default (off) on purpose: nginx drops the upstream request
    # when the browser disconnects, which is what makes the stop button and
    # the server's client-disconnect detection work through the proxy.
    # proxy_ignore_client_abort off;

    # Attachments are base64'd into the JSON body; matches the server's
    # express.json({ limit: '32mb' }) so nginx is never the tighter limit.
    client_max_body_size 32m;
  }

  # Unknown paths are client-side routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
